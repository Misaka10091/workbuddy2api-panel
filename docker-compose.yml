services:
  wb2api:
    # 镜像命名默认 = misaka10092/workbuddy2api-panel:latest（Docker Hub 命名空间 + 仓库名 + latest）。
    # 与 scripts/docker.sh 共用同一套默认值；要换名字/标签写进 .env 或直接传环境变量：
    #   IMAGE_NAME=my/api IMAGE_TAG=v1 docker compose up -d --build
    # 注：docker 要求仓库名全小写，写 Misaka10092/… 会被 docker 直接拒绝。
    image: ${IMAGE_NAME:-misaka10092/workbuddy2api-panel}:${IMAGE_TAG:-latest}
    # 版本要素（面板左上角）：镜像里没有 .git，只能在宿主机侧算好再传进去。
    # `./scripts/docker.sh build|up` 会自动填 tag/提交两项；构建时刻由 Dockerfile 里的
    # `date` 取（随 ARG 传每次都会变，编译层缓存就永远命中不了）。三项都缺时版本串
    # 只剩构建时间，不会显示假 hash。
    build:
      context: .
      args:
        BUILD_VERSION: ${BUILD_VERSION:-}
        BUILD_COMMIT: ${BUILD_COMMIT:-}
        BUILD_TIME: ${BUILD_TIME:-}
    container_name: workbuddy2api
    restart: unless-stopped
    # 容器默认以 app 用户（uid 10001）运行。宿主机挂载目录属主不同会导致
    # 「写入 auths/*.json.tmp 失败 permission denied」，三种解法任选：
    #   1) 非 root · 让容器以你自己的 uid 运行（挂载目录本来就是你建的）：
    #      PUID=$(id -u) PGID=$(id -g) docker compose up -d
    #      或写进 .env 文件：PUID=1000 / PGID=1000
    #   2) sudo chown -R 10001:10001 ./auths ./data ./config.json
    #   3) user: "0:0" 以 root 运行（省事但容器逃逸面更大，自担）
    user: "${PUID:-10001}:${PGID:-10001}"
    environment:
      - TZ=Asia/Shanghai
    ports:
      - "7863:7863"
    volumes:
      - ./auths:/app/auths
      - ./data:/app/data
      # 注意：宿主机必须先有 config.json（cp config.example.json config.json）。
      # 缺失时 Docker 会把挂载点创建成目录 → 容器启动失败（程序会自动生成配置，
      # 但前提是它能以文件形式写入 —— 挂载目录会挡住这条路径）。
      # 不挂 :ro：面板「配置」页需要写回此文件（保存后热生效）。
      - ./config.json:/app/config.json
