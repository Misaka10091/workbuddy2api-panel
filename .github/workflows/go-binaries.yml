name: go-binaries

# 可运行二进制构建/发布：
#   - PR / push main → 测试 + 五平台编译验证（产物仅存 artifact，不发布）
#   - push v* tag    → 同上 + 打包上传到 GitHub Release（zip/tar.gz + checksums）
# 版本纪律（2026-10 起）：版本串由二进制自己算，不再写在源码里——
#   tag 构建   → 原样展示 tag（v2026.10.27.2038 / v1.14.0），由这里 -X 注入并断言；
#   非 tag 构建 → v<构建时间 +08:00>-<提交短 hash>（构建时间与 hash 在运行时拼）。
# 面板左上角展示的就是这一串；发布资产名沿用 tag（非 tag 构建只产 CI artifact）。
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - "go.mod"
      - "go.sum"
      - "cmd/**"
      - "internal/**"
      - "config.example.json"
      - ".github/workflows/go-binaries.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # ubuntu runner 自带 node → panel 包的 JS 运行时冒烟测试（TestAppJSTopLevelSmoke）会真实执行
      - run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: windows, goarch: amd64, ext: .zip }
          - { goos: linux, goarch: amd64, ext: .tar.gz }
          - { goos: linux, goarch: arm64, ext: .tar.gz }
          - { goos: darwin, goarch: amd64, ext: .tar.gz }
          - { goos: darwin, goarch: arm64, ext: .tar.gz }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: 取版本要素（tag 构建才有 tag；"构建时间 + 短 hash" 由 server 侧拼）
        id: ver
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: 构建（注入版本要素，剥离符号，对齐本地发布口径）
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
          TAG: ${{ steps.ver.outputs.tag }}
          BUILT_AT: ${{ steps.ver.outputs.built_at }}
        run: |
          go build -ldflags "-s -w -X main.buildVersion=$TAG -X main.buildCommit=$GITHUB_SHA -X main.buildTime=$BUILT_AT" \
            -o "wb2api${{ matrix.goos == 'windows' && '.exe' || '' }}" ./cmd/server

      # 版本串断言：tag 构建必须含 tag；所有构建都必须含本次提交号与注入的构建时刻。
      # 提交号防交叉编译矩阵里编错树（buildinfo 的 vcs.revision 会跟着变），
      # 构建时刻只可能来自 -X，所以它同时证明 ldflags 注入真的生效了。
      - name: 断言二进制版本串
        env:
          TAG: ${{ steps.ver.outputs.tag }}
          SHA: ${{ github.sha }}
          BUILT_AT: ${{ steps.ver.outputs.built_at }}
        run: |
          BIN="wb2api${{ matrix.goos == 'windows' && '.exe' || '' }}"
          if [ -n "$TAG" ] && ! grep -qaF "$TAG" "$BIN"; then
            echo "::error::binary missing tag version $TAG"
            exit 1
          fi
          if ! grep -qaF "$SHA" "$BIN"; then
            echo "::error::binary missing commit $SHA"
            exit 1
          fi
          if ! grep -qaF "$BUILT_AT" "$BIN"; then
            echo "::error::binary missing injected build time $BUILT_AT"
            exit 1
          fi
          echo "version assert OK: tag=${TAG:-<snapshot>} commit=$SHA built_at=$BUILT_AT"

      - name: 打包（windows=zip 三件套，其余=tar.gz）
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          if [ -n "$TAG" ]; then
            V="$TAG"
          else
            # 非 tag 构建的产物名只用于 CI artifact（不发布），用 snapshot-<短 hash>。
            V="snapshot-$(printf '%s' "$GITHUB_SHA" | cut -c1-7)"
          fi
          case "${{ matrix.goos }}" in
            windows)
              NAME="wb2api-panel-${V}-windows-amd64.zip"
              zip -q "$NAME" wb2api.exe config.example.json README.md
              ;;
            *)
              NAME="wb2api-panel-${V}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz"
              tar czf "$NAME" wb2api config.example.json README.md
              ;;
          esac
          echo "name=$NAME" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.name }}
          path: ${{ env.name }}
          retention-days: 7

  # 仅 tag 触发：校验 tag 形态 → 汇总资产 → 建 Release
  # 不再比对"tag == 源码版本"：版本号不再写在源码里，tag 本身就是版本串（构建
  # 步骤已把它 -X 进二进制并断言过），所以时间戳 tag 与 semver tag 都能发。
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 取历史 tag 算 compare 链接
      - name: tag 形态校验
        run: |
          case "$GITHUB_REF_NAME" in
            v[0-9]*) ;;
            *) echo "::error::tag $GITHUB_REF_NAME 不合法（应形如 v2026.10.27.2038 或 v1.14.0）"; exit 1 ;;
          esac
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        run: cd dist && sha256sum *.zip *.tar.gz > checksums.txt && ls -la
      - name: 上一版 tag（compare 链接用）
        id: prev
        run: |
          PREV=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          echo "prev=${PREV}" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}-panel
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            CI 自动构建发布（五平台二进制 + checksums）。

            完整变更：https://github.com/${{ github.repository }}/compare/${{ steps.prev.outputs.prev }}...${{ github.ref_name }}
          files: dist/*
